name: Refresh data

# Runs the whole pipeline on a GitHub runner (no local GPU or network access needed):
# scrape OpenReview -> SPECTER2 embeddings (CPU) -> UMAP/HDBSCAN layout -> commit -> redeploy.
# Run it from the Actions tab once accepted papers are public, and again when
# camera-ready abstracts change.
on:
  workflow_dispatch:
    inputs:
      scrape:
        description: "Scrape OpenReview first. Untick if data/neurips_2026_papers.json was committed from your own machine."
        type: boolean
        default: true

permissions:
  contents: write   # commit the regenerated data files
  actions: write    # start the Pages deployment afterwards

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-specter2
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt
      # Tells a blocked client/network (2025 also fails) from a 2026-specific problem.
      - name: Probe OpenReview
        if: ${{ inputs.scrape }}
        continue-on-error: true
        run: |
          for q in "notes?content.venueid=NeurIPS.cc/2025/Conference&limit=1" \
                   "notes?content.venueid=NeurIPS.cc/2026/Conference&limit=1" \
                   "groups?id=NeurIPS.cc/2026/Conference"; do
            echo "=== $q"
            curl -sS -m 30 -i -A "neurips-explorer" "https://api2.openreview.net/$q" | head -c 1500
            echo
          done
      - name: Scrape OpenReview
        if: ${{ inputs.scrape }}
        env:
          # Optional repository secrets; only needed if anonymous access is refused.
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: python scrape.py
      - run: python embed.py
      - run: python layout.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No data changes."; exit 0; }
          git commit -m "Refresh NeurIPS 2026 data"
          git push
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start Pages explicitly.
      - name: Deploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
