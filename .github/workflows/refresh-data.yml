name: Refresh data

# Runs the whole pipeline on a GitHub runner (no local GPU or network access needed):
# scrape neurips.cc (or OpenReview) -> SPECTER2 embeddings (CPU) -> UMAP/HDBSCAN layout -> pull request.
# main is protected (pull request required, signed commits), so the data goes to the data-refresh
# branch and a pull request, which the workflow squash-merges itself (GitHub signs that commit) before
# starting the Pages deployment. If the merge is refused, the pull request stays open for a manual merge.
# Run it from the Actions tab once accepted papers are public, and again when
# camera-ready abstracts change.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where the paper list comes from"
        type: choice
        default: neurips.cc
        options:
          - neurips.cc
          - openreview
          - committed   # use data/neurips_2026_papers.json as it is in the repository

permissions:
  contents: write        # push the data-refresh branch
  pull-requests: write   # open and merge the pull request (needs Settings > Actions > "Allow GitHub Actions to create and approve pull requests")
  actions: write         # start the Pages deployment afterwards

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-specter2
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt
      # Prints what neurips.cc returns (card count, where the abstract sits), whatever happens next.
      - name: Probe neurips.cc
        if: ${{ inputs.source == 'neurips.cc' }}
        continue-on-error: true
        run: python scrape_site.py --probe
      - name: Scrape neurips.cc
        if: ${{ inputs.source == 'neurips.cc' }}
        run: python scrape_site.py
      # OpenReview has not released the 2026 papers, and it blocks scripts on GitHub runners.
      - name: Scrape OpenReview
        if: ${{ inputs.source == 'openreview' }}
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: python scrape.py
      - run: python embed.py
      - run: python layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data
      - name: Open data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No data changes."; exit 0; }
          git switch -C data-refresh
          git commit -m "Refresh NeurIPS 2026 data"
          git push --force origin data-refresh
          if [ -z "$(gh pr list --head data-refresh --state open --json number --jq '.[].number')" ]; then
            gh pr create --head data-refresh --base "${GITHUB_REF_NAME}" \
              --title "Refresh NeurIPS 2026 data" \
              --body "Regenerated by the Refresh data workflow (source: ${{ inputs.source }})."
          fi
          if gh pr merge data-refresh --squash --delete-branch; then
            # A merge made with GITHUB_TOKEN does not trigger other workflows, so start Pages explicitly.
            gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "::warning::Could not merge the data-refresh pull request; merge it manually (Squash and merge)."
          fi
