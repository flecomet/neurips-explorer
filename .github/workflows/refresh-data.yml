name: Refresh data

# Runs the whole pipeline on a GitHub runner (no local GPU or network access needed):
# scrape neurips.cc (or OpenReview) -> SPECTER2 embeddings (CPU) -> UMAP/HDBSCAN layout -> commit -> redeploy.
# Run it from the Actions tab once accepted papers are public, and again when
# camera-ready abstracts change.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where the paper list comes from"
        type: choice
        default: neurips.cc
        options:
          - neurips.cc
          - openreview
          - committed   # use data/neurips_2026_papers.json as it is in the repository

permissions:
  contents: write   # commit the regenerated data files
  actions: write    # start the Pages deployment afterwards
  pull-requests: write   # open a pull request when main is protected

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-specter2
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt
      # Prints what neurips.cc returns (card count, where the abstract sits), whatever happens next.
      - name: Probe neurips.cc
        if: ${{ inputs.source == 'neurips.cc' }}
        continue-on-error: true
        run: python scrape_site.py --probe
      - name: Scrape neurips.cc
        if: ${{ inputs.source == 'neurips.cc' }}
        run: python scrape_site.py
      # OpenReview has not released the 2026 papers, and it blocks scripts on GitHub runners.
      - name: Scrape OpenReview
        if: ${{ inputs.source == 'openreview' }}
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: python scrape.py
      - run: python embed.py
      - run: python layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data
      # main requires pull requests and verified signatures, so a direct push can be refused.
      # In that case the commit goes to a branch and a pull request is opened (squash-merge it).
      - name: Commit data
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No data changes."; exit 0; }
          git commit -m "Refresh NeurIPS 2026 data"
          if git push; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            branch="refresh-data-$(date -u +%Y%m%d-%H%M)"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Refresh NeurIPS 2026 data" --body "Regenerated by the Refresh data workflow."
          fi
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start Pages explicitly.
      - name: Deploy site
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
