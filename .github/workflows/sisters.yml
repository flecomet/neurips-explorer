name: Sister explorers

# Runs each sister repository's tests with this commit's shared files, so a template
# change that breaks another explorer fails here before it is synced.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [flecomet/cvpr-explorer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: sisters/${{ matrix.repo }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python sync_template.py "sisters/${{ matrix.repo }}" --test
